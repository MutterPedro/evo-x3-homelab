# ComfyUI model locations. Mounted read-only into the ComfyUI container at
# /opt/ComfyUI/extra_model_paths.yaml. /comfyhome is @EVO_COMFY_DIR@ on the host.
comfyui:
  base_path: /comfyhome/comfy-models
  text_encoders: text_encoders
  vae: vae
  checkpoints: checkpoints
  diffusion_models: diffusion_models
  unet: unet
  loras: loras
  latent_upscale_models: latent_upscale_models
  clip_vision: clip_vision
